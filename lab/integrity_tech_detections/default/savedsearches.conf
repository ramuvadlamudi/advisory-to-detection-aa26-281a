[AA26-281A - Exchange password spray - Rule]
description = One source fails against ten or more mailboxes, a few attempts each, across Exchange interfaces (EBurst-style spraying).
search = `aa26_iis` cs_uri_stem IN ("/EWS/*","/owa/*","/ecp/*","/oab/*","/mapi/*","/rpc/*","/autodiscover/*","/powershell*","/Microsoft-Server-ActiveSync*","/api/*") \
| eval interface=lower(mvindex(split(cs_uri_stem,"/"),1)) \
| bin _time span=30m \
| stats count(eval(sc_status=401)) as failures dc(eval(if(sc_status=401,cs_username,null()))) as users dc(interface) as interfaces values(eval(if(sc_status=200,cs_username,null()))) as ok by _time c_ip \
| where users>=10 AND failures/users<=3 \
| rename c_ip as src
action.correlationsearch.enabled = 1
action.correlationsearch.label = AA26-281A - Exchange password spray - Rule
action.correlationsearch.detection_type = ebd
action.correlationsearch.annotations = {"analytic_story": ["AA26-281A Integrity Tech", "Flax Typhoon"], "mitre_attack": ["T1110.003"], "type": "TTP", "data_source": [], "kill_chain_phases": []}
action.correlationsearch.metadata = {"deprecated": "0", "detection_id": "10468d2d-b427-5740-ab0a-dc36f9342270", "detection_version": "1"}
action.risk = 1
action.risk.param._risk = [{"risk_object_field": "src", "risk_object_type": "system", "risk_score": 20}, {"threat_object_field": "src", "threat_object_type": "ip_address"}]
action.risk.param._risk_message = $src$ failed against $users$ mailboxes across $interfaces$ Exchange interfaces in 30 minutes
action.risk.param._risk_score = 0
action.risk.param.verbose = 0
cron_schedule = */30 * * * *
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
enableSched = 1
schedule_window = auto
counttype = number of events
relation = greater than
quantity = 0
alert.track = 0
alert.digest_mode = 0
request.ui_dispatch_app = SplunkEnterpriseSecuritySuite
