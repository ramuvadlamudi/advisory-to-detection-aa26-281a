# AA26-D09: generated from the AA26-281A lab. Adapt names, indexes and thresholds to your environment.
id: "AA26-D09"
name: "AA26-281A - Unapproved app reading many mailboxes - Rule"
behaviour: "office-cli style collection through a Microsoft 365 app registration"
description: "An application not on the approved list reads five or more mailboxes (office-cli style collection through an app registration)."
mitre_attack:
  - "T1114.002"
  - "T1550.001"
data_sources: "Microsoft 365 unified audit log, MailItemsAccessed: AppId, MailboxOwnerUPN, ClientIPAddress"
cim: "None (vendor fields)"
prerequisites: "None beyond the data sources"
search: |
  `aa26_o365` Operation=MailItemsAccessed
  | stats dc(MailboxOwnerUPN) as mailboxes count values(ClientIPAddress) as src by AppId
  | lookup approved_mail_apps AppId OUTPUT owner
  | where mailboxes>=5 AND isnull(owner)
schedule: "25 * * * *"
search_window: "-24h@h to @h"
severity: "high"
risk: "AppId (other) +40"
false_positives:
  - "A new approved integration not yet in the register"
tuning:
  - "approved_mail_apps lookup with owner"
  - "Requires MailItemsAccessed enabled and retained for every mailbox"
tests:
  positive: "The rogue app owned by j.citizen reading 7 mailboxes fires once"
  negative: "The approved backup app reading every audited mailbox stays silent"
owner: "SOC Detection Engineering (Cloud)"
review_date: "2027-02-23"
response: "Disable the app's credentials, review its consent and owner, and scope the mailboxes read."
lab_backtest_rows: 1
