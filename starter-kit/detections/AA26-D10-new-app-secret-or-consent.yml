# AA26-D10: generated from the AA26-281A lab. Adapt names, indexes and thresholds to your environment.
id: "AA26-D10"
name: "AA26-281A - New app secret or consent - Rule"
behaviour: "Credentials added to an application, or consent granted"
description: "A credential is added to an application or service principal, or a user consents to an application."
mitre_attack:
  - "T1098.001"
data_sources: "Microsoft 365 / Entra audit: UserId, Operation, ObjectId"
cim: "Change"
prerequisites: "None beyond the data sources"
search: |
  `aa26_o365` Operation IN ("Add service principal credentials*","*Certificates and secrets*","Consent to application*")
  | stats count values(ObjectId) as app values(ClientIP) as src by UserId Operation
  | rename UserId as user
schedule: "*/30 * * * *"
search_window: "-70m@m to -10m@m"
severity: "medium"
risk: "user (user) +30"
false_positives:
  - "Routine secret rotation by the app owner"
tuning:
  - "Correlate with change records; alert on apps with mail permissions first"
tests:
  positive: "j.citizen adding a secret to the rogue app the night before collection fires once"
  negative: "Scheduled rotation by the integration team, with a change record, is closed as expected"
owner: "SOC Detection Engineering (Cloud)"
review_date: "2027-02-23"
response: "Confirm with the app owner; if unexpected, remove the credential and review the app's permissions."
lab_backtest_rows: 1
