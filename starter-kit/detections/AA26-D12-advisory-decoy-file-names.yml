# AA26-D12: generated from the AA26-281A lab. Adapt names, indexes and thresholds to your environment.
id: "AA26-D12"
name: "AA26-281A - Advisory decoy file names - Rule"
behaviour: "Mail dumps and tools staged under the advisory's decoy names"
description: "Files named like AA26-281A's staging and tool files (001.gif, Css.js, M2k*.js, Include.png, All_scanner_v*.pl.gz, .sess.zip)."
mitre_attack:
  - "T1036.008"
  - "T1074.001"
data_sources: "Sysmon event 11 or EDR file telemetry: dest, file_path, file_name"
cim: "Endpoint.Filesystem"
prerequisites: "None beyond the data sources"
search: |
  | tstats count from datamodel=Endpoint.Filesystem where Filesystem.file_name IN ("001.gif","Css.js","M2k*.js","Include.png","All_scanner_v*.pl.gz",".sess.zip") by Filesystem.dest Filesystem.file_path Filesystem.file_name
  | rename Filesystem.* as *
  | eval dest=upper(mvindex(split(dest,"."),0))
schedule: "20 * * * *"
search_window: "-70m@m to -10m@m"
severity: "medium"
risk: "dest (system) +30"
false_positives:
  - "Web deployments that legitimately ship Css.js or similar names"
tuning:
  - "Exclude by host role and path (for example the web root on WEB01)"
tests:
  positive: "The staged files on WS-0417 fire"
  negative: "Ordinary image and script files with other names stay silent"
owner: "SOC Detection Engineering (Endpoint)"
review_date: "2027-02-23"
response: "Check the file's size, type and creator; a large 'image' or 'script' is likely an archive."
lab_backtest_rows: 3
