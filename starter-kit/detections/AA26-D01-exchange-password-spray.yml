# AA26-D01: generated from the AA26-281A lab. Adapt names, indexes and thresholds to your environment.
id: "AA26-D01"
name: "AA26-281A - Exchange password spray - Rule"
behaviour: "EBurst-style password spraying across Exchange interfaces"
description: "One source fails against ten or more mailboxes, a few attempts each, across Exchange interfaces (EBurst-style spraying)."
mitre_attack:
  - "T1110.003"
data_sources: "Exchange IIS W3C logs: c_ip, cs_username, cs_uri_stem, sc_status (all ten Exchange virtual directories)"
cim: "Web (partial): IIS fields are used directly because CIM Web has no username field"
prerequisites: "None beyond the data sources"
search: |
  `aa26_iis` cs_uri_stem IN ("/EWS/*","/owa/*","/ecp/*","/oab/*","/mapi/*","/rpc/*","/autodiscover/*","/powershell*","/Microsoft-Server-ActiveSync*","/api/*")
  | eval interface=lower(mvindex(split(cs_uri_stem,"/"),1))
  | bin _time span=30m
  | stats count(eval(sc_status=401)) as failures dc(eval(if(sc_status=401,cs_username,null()))) as users dc(interface) as interfaces values(eval(if(sc_status=200,cs_username,null()))) as ok by _time c_ip
  | where users>=10 AND failures/users<=3
  | rename c_ip as src
schedule: "*/30 * * * *"
search_window: "-70m@m to -10m@m"
severity: "low"
risk: "src (system) +20"
false_positives:
  - "Load balancers, reverse proxies or NAT egress presenting many users as one address"
  - "Mobile gateways after a password-policy change"
tuning:
  - "Ingest the real client address (X-Forwarded-For) where a proxy fronts Exchange"
  - "Allow-list known gateways in a lookup with an owner and review date; never by subnet wildcard"
tests:
  positive: "Replay of the lab spray (64 mailboxes, 104 failures, 4 interfaces from 203.0.113.47) fires once"
  negative: "Monday-morning logon surge and the mobile gateway's routine failures stay silent"
owner: "SOC Detection Engineering (Identity)"
review_date: "2027-02-23"
response: "Score only. Check the source's reputation; if it is internal, open a host investigation. Watch AA26-D02 for a success."
lab_backtest_rows: 1
