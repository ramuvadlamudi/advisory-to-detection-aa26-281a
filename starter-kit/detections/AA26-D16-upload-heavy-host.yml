# AA26-D16: generated from the AA26-281A lab. Adapt names, indexes and thresholds to your environment.
id: "AA26-D16"
name: "AA26-281A - Upload-heavy host - Rule"
behaviour: "Bulk upload from a host that normally downloads"
description: "A host sends over 100 MB in an hour and at least five times what it receives."
mitre_attack:
  - "T1048"
  - "T1041"
data_sources: "Firewall or NetFlow: src, bytes_in, bytes_out"
cim: "Network_Traffic"
prerequisites: "None beyond the data sources"
search: |
  | tstats sum(All_Traffic.bytes_out) as bytes_out sum(All_Traffic.bytes_in) as bytes_in from datamodel=Network_Traffic by All_Traffic.src _time span=1h
  | rename All_Traffic.src as src
  | where bytes_out > 5*bytes_in AND bytes_out > 100000000
  | eval MB_out=round(bytes_out/1e6)
schedule: "5 * * * *"
search_window: "-2h@h to -1h@h"
severity: "low"
risk: "src (system) +20"
false_positives:
  - "Backups, cloud sync, video uploads"
tuning:
  - "Hourly window; over 100 MB and five times the bytes received"
  - "Allow-list backup servers by host"
tests:
  positive: "WS-0417 (5 hours through the tunnel) and WS-0458 (186 MB FishHub upload): 6 rows"
  negative: "Workstations' normal download-heavy traffic stays silent"
owner: "SOC Detection Engineering (Network)"
review_date: "2027-02-23"
response: "Score only; corroborate with the destination and the process responsible."
lab_backtest_rows: 6
