# AA26-C01: generated from the AA26-281A lab. Adapt names, indexes and thresholds to your environment.
id: "AA26-C01"
name: "AA26-281A - Integrity Tech behaviour chain - Rule"
behaviour: "Several AA26-281A behaviours on one identity or one host"
description: "Risk from the AA26-281A detections adds up to 100 or more across three or more ATT&CK tactics for one user or system."
mitre_attack:
  - "TA0001-TA0011 (any three tactics)"
data_sources: "ES risk index (Risk data model): risk_object, risk_object_type, calculated_risk_score, ATT&CK tactic"
cim: "Risk"
prerequisites: "None beyond the data sources"
search: |
  | tstats sum(All_Risk.calculated_risk_score) as risk_score dc(All_Risk.annotations.mitre_attack.mitre_tactic_id) as tactics dc(source) as detections values(source) as sources from datamodel=Risk.All_Risk where source="AA26-281A - *" by All_Risk.risk_object All_Risk.risk_object_type
  | rename All_Risk.* as *
  | where risk_score>=100 AND tactics>=3
schedule: "30 * * * *"
search_window: "-7d@h to now"
severity: "high"
risk: "raises a finding (severity high)"
false_positives:
  - "Shared or service identities that collect risk from many hosts"
tuning:
  - "Scores add up per entity (same risk_object and risk_object_type); there is no cross-entity sum"
  - "Host signals reach a user only when the detection writes risk to the host's assigned owner"
tests:
  positive: "j.citizen (identity) 200 across six tactics, and a.lim 100 across three: 2 findings"
  negative: "WS-0417 (host, 80) and 203.0.113.47 (90) stay below 100 on their own"
owner: "SOC Manager (finding queue)"
review_date: "2027-02-23"
response: "Follow 07-analyst-investigation-playbook.md: open the finding, read the contributing events, validate the identity, inspect the host, explain, escalate."
lab_backtest_rows: 2
